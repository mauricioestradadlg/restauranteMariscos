<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menú | Restaurante Mariscos S.A. de C.V.</title>

    <!-- Logo mostrado en la pestaña del navegador -->
    <link
        rel="icon"
        type="image/png"
        href="img/logoMariscos.png"
    >

    <!-- Logo para dispositivos Apple -->
    <link
        rel="apple-touch-icon"
        href="img/logoMariscos.png"
    >

    <!-- Archivo de estilos -->
    <link
        rel="stylesheet"
        href="styles.css"
    >

    <!-- Archivo JavaScript del menú -->
    <script
        src="menu.js"
        defer
    ></script>

    <script
    src="nav.js"
    defer
></script>
</head>

<body>

       <!-- =========================================
     ENCABEZADO Y NAVEGACIÓN
     ========================================= -->
<header class="header">

    <nav
        class="navbar"
        aria-label="Navegación principal"
    >

        <!-- Logo y nombre completo del restaurante -->
        <a
            href="index.html"
            class="nav-brand"
            aria-label="Ir a la página principal"
        >

            <img
                src="img/logoMariscos.png"
                alt="Logo de Restaurante Mariscos"
                class="nav-brand-logo"
            >

            <span class="nav-brand-text">

                <span class="nav-brand-name">
                    Restaurante Mariscos
                </span>

                <span class="nav-brand-company">
                    S.A. de C.V.
                </span>

            </span>

        </a>

        <!-- Botón de navegación para dispositivos móviles -->
        <button
            type="button"
            class="nav-toggle"
            aria-expanded="false"
            aria-controls="nav-links-principal"
            aria-label="Abrir menú de navegación"
        >

            <span
                class="nav-toggle-line"
                aria-hidden="true"
            ></span>

            <span
                class="nav-toggle-line"
                aria-hidden="true"
            ></span>

            <span
                class="nav-toggle-line"
                aria-hidden="true"
            ></span>

        </button>

        <!-- Opciones de navegación -->
        <ul
            class="nav-links"
            id="nav-links-principal"
        >

            <li>
                <a
                    href="menu.html"
                    class="nav-link"
                >
                    Menú
                </a>
            </li>

            <li>
                <a
                    href="facturacion.html"
                    class="nav-link nav-link-highlighted"
                >
                    Facturación
                </a>
            </li>

        </ul>

    </nav>

</header>


    <!-- =========================================
         CONTENIDO PRINCIPAL
         ========================================= -->
    <main
        class="contenido-principal menu-page"
        id="menu"
    >

        <!-- =========================================
             TÍTULO PRINCIPAL
             ========================================= -->
        <h1 class="titulo-principal">
            Menú
        </h1>

        <!-- =========================================
             CATEGORÍAS DEL MENÚ
             ========================================= -->
        <section
            class="menu-categorias-section"
            id="categorias-menu"
            aria-labelledby="titulo-categorias-menu"
        >

            <h2
                class="menu-categorias-titulo"
                id="titulo-categorias-menu"
            >
                ¡Dale un vistazo a nuestros deliciosos platillos!
            </h2>

            <p class="menu-categorias-instruccion">
                Selecciona una categoría para consultar las opciones disponibles.
            </p>

            <div class="menu-categorias-grid">

                <!-- Entradas -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="entradas"
                    aria-pressed="false"
                    aria-label="Mostrar opciones de entradas"
                >

                    <img
                        src="https://images.unsplash.com/photo-1625943553852-781c6dd46faa?q=80&w=1045&auto=format&fit=crop"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Entradas
                    </span>

                </button>

                <!-- Tacos -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="tacos"
                    aria-pressed="false"
                    aria-label="Mostrar opciones de tacos"
                >

                    <img
                        src="https://images.unsplash.com/photo-1624300629298-e9de39c13be5?q=80&w=1000&auto=format&fit=crop"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Tacos
                    </span>

                </button>

                <!-- Tostadas -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="tostadas"
                    aria-pressed="false"
                    aria-label="Mostrar opciones de tostadas"
                >

                    <img
                        src="img/tostadasCamaron.jpg"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Tostadas
                    </span>

                </button>

                <!-- Caldos -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="caldos"
                    aria-pressed="false"
                    aria-label="Mostrar opciones de caldos"
                >

                    <img
                        src="https://images.unsplash.com/photo-1726514731660-08f11ef1fdc1?q=80&w=1200&auto=format&fit=crop"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Caldos
                    </span>

                </button>

                <!-- Platillos -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="platillos"
                    aria-pressed="false"
                    aria-label="Mostrar platillos principales"
                >

                    <img
                        src="https://images.unsplash.com/photo-1735357744836-17ed06db25d9?q=85&w=1200&auto=format&fit=crop"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Platillos
                    </span>

                </button>

                <!-- Bebidas -->
                <button
                    type="button"
                    class="menu-categoria-card"
                    data-categoria="bebidas"
                    aria-pressed="false"
                    aria-label="Mostrar opciones de bebidas"
                >

                    <img
                        src="https://www.infobae.com/new-resizer/uG1_j7rxuCS3kHhMu-ThO0rrDEo=/arc-anglerfish-arc2-prod-infobae/public/IDNEPYYXRJBFHBLLZZ5BO5OJDY.jpg"
                        alt=""
                        class="menu-categoria-imagen"
                        loading="lazy"
                    >

                    <span class="menu-categoria-nombre">
                        Bebidas
                    </span>

                </button>

            </div>

        </section>

        <!-- =========================================
             RESULTADOS DE LA CATEGORÍA SELECCIONADA
             ========================================= -->
        <section
            class="menu-resultados-section"
            id="menu-resultados"
            aria-labelledby="menu-resultados-titulo"
            aria-live="polite"
            hidden
        >

            <div class="menu-resultados-encabezado">

                <p class="menu-resultados-etiqueta">
                    Categoría seleccionada
                </p>

                <h2
                    class="menu-resultados-titulo"
                    id="menu-resultados-titulo"
                >
                </h2>

                <p
                    class="menu-resultados-descripcion"
                    id="menu-resultados-descripcion"
                >
                </p>

            </div>

            <!-- JavaScript agregará aquí las seis tarjetas -->
            <div
                class="menu-platillos-grid"
                id="menu-platillos-grid"
            >
            </div>

        </section>

    </main>

    <!-- =========================================
         PIE DE PÁGINA
         ========================================= -->
    <footer class="footer">

        <div
            class="social-icons"
            aria-label="Redes sociales"
        >

            <!-- Facebook -->
            <a
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visitar Facebook"
                class="social-link"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    class="social-icon"
                >
                    <path
                        d="M13.5 22v-9h3l.5-3.5h-3.5V7.25c0-1.02.28-1.72 1.75-1.72H17.1V2.4c-.32-.04-1.42-.14-2.7-.14-2.67 0-4.5 1.63-4.5 4.62V9.5H7V13h2.9v9h3.6Z"
                    />
                </svg>

            </a>

            <!-- Instagram -->
            <a
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Visitar Instagram"
                class="social-link"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    class="social-icon"
                >
                    <path
                        d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.15 1.5a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
                    />
                </svg>

            </a>

        </div>

        <p class="footer-text">
            © 2026 Restaurante Mariscos S.A. de C.V.
            Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
